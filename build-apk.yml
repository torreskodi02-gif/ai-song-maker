# AI Song Maker — Build APK
# Same proven pattern as Quantum Signal (build-apk-v087.yml):
# versionCode = GitHub run number, versionName = package.json version,
# debug APK uploaded as an artifact AND published to the `latest` release,
# which is the permanent download link the in-app updater checks.
# NOTE: the GitHub App cannot push .github/workflows files (403), so if this
# file is missing from the repo, paste it via GitHub's web editor at
# .github/workflows/build-apk.yml — same file, kept as build-apk.yml at the
# project root for exactly that reason.
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Regenerate the Android scaffold, keeping our MainActivity
        run: |
          if [ -f android/app/src/main/java/app/aisongmaker/MainActivity.java ]; then
            cp android/app/src/main/java/app/aisongmaker/MainActivity.java /tmp/MainActivity.java
            echo "saved committed MainActivity.java"
          fi
          rm -rf android
          npx cap add android
          if [ -f /tmp/MainActivity.java ]; then
            mkdir -p android/app/src/main/java/app/aisongmaker
            cp /tmp/MainActivity.java android/app/src/main/java/app/aisongmaker/MainActivity.java
            echo "restored MainActivity.java"
          fi
      - run: sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 23/' android/variables.gradle
      - name: Allow microphone and audio in the app
        run: |
          F=android/app/src/main/AndroidManifest.xml
          python3 - "$F" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          for perm in ["android.permission.RECORD_AUDIO",
                       "android.permission.MODIFY_AUDIO_SETTINGS",
                       "android.permission.INTERNET",
                       "android.permission.FOREGROUND_SERVICE",
                       "android.permission.WAKE_LOCK"]:
              tag = '<uses-permission android:name="' + perm + '" />'
              if perm not in s:
                  s = s.replace("<application", tag + "\n    <application", 1)
          open(p, "w").write(s)
          print("mic/audio permissions added")
          PY
      - run: npx cap sync android
      - name: Stamp the app version into the APK
        run: |
          python3 - <<'PY'
          import json, os, re
          pkg = json.load(open("package.json"))
          ver = pkg["version"]
          run = os.environ.get("GITHUB_RUN_NUMBER", "1")
          p = "android/app/build.gradle"
          s = open(p).read()
          s2, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {run}', s, count=1)
          assert n1 == 1, "versionCode not found in build.gradle"
          s3, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "{ver}"', s2, count=1)
          assert n2 == 1, "versionName not found in build.gradle"
          open(p, "w").write(s3)
          print(f"stamped APK version {ver} (build {run})")
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-song-maker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ai-song-maker.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest ai-song-maker.apk --target "$GITHUB_SHA" --title "AI Song Maker (newest build)" --notes "Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC" --latest
